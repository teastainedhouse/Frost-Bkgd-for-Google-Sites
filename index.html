<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hero Text Widget</title>
  <style>
    :root {
      /* Defaults (can be overridden via URL params) */
      --text: "Chiara Pieri is an illustrator in the Boston area.";
      --text-color: #ffffff;

      /* “Frosted” panel */
      --panel-opacity: 0.45;          /* 0.00–1.00 */
      --panel-blur: 10px;             /* 0px disables blur */
      --panel-radius: 18px;

      /* Sizing */
      --max-width: 980px;
      --font-size: clamp(20px, 2.6vw, 44px);
      --pad-y: clamp(8px, 1.2vw, 14px);
      --pad-x: clamp(12px, 1.6vw, 20px);

      /* Readability helpers */
      --panel-shadow: 0 14px 40px rgba(0,0,0,0.22);
      --text-shadow: 0 2px 10px rgba(0,0,0,0.60);

      /* Alignment: center | left | right */
      --align: center;
    }

    /* Critical: keep the iframe background transparent */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      background: transparent;
      overflow: hidden; /* prevents scrollbars in the embed */
    }

    .stage {
      height: 100%;
      width: 100%;
      display: grid;
      place-items: center;
      padding: clamp(14px, 3vw, 40px);
      box-sizing: border-box;
    }

    .panel {
      display: inline-block;
      width: auto; /* hug content */
      max-width: min(92vw, var(--max-width)); /* still wrap nicely on mobile */
      border-radius: var(--panel-radius);
      padding: var(--pad-y) var(--pad-x);
      box-shadow: var(--panel-shadow);
      background: rgba(255, 255, 255, var(--panel-opacity));
      -webkit-backdrop-filter: blur(var(--panel-blur));
      backdrop-filter: blur(var(--panel-blur));
    }

    .text {
      margin: 0;
      color: var(--text-color);
      font-size: var(--font-size);
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: 0.2px;
      text-shadow: var(--text-shadow);
      text-align: var(--align);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="panel" role="group" aria-label="Hero text panel">
      <p class="text" id="heroText">Chiara Pieri is an illustrator in the Boston area.</p>
    </div>
  </div>

  <script>
    // Optional: configure via URL params so you don’t have to edit the file for small tweaks.
    // Example:
    // ?text=Hello%20world&opacity=0.40&blur=12&align=center&color=ffffff
    const params = new URLSearchParams(location.search);

    const heroText = document.getElementById("heroText");

    const text = params.get("text");
    if (text) heroText.textContent = text;

    // Text color (hex without #, e.g. ffffff)
    const color = params.get("color");
    if (color && /^[0-9a-fA-F]{6}$/.test(color)) {
      document.documentElement.style.setProperty("--text-color", `#${color}`);
    }

    // Panel opacity (0–1)
    const opacity = parseFloat(params.get("opacity"));
    if (!Number.isNaN(opacity)) {
      const clamped = Math.min(1, Math.max(0, opacity));
      document.documentElement.style.setProperty("--panel-opacity", clamped.toString());
    }

    // Blur in px
    const blur = parseFloat(params.get("blur"));
    if (!Number.isNaN(blur)) {
      const clamped = Math.max(0, blur);
      document.documentElement.style.setProperty("--panel-blur", `${clamped}px`);
    }

    // Alignment
    const align = params.get("align");
    if (["left","center","right"].includes(align)) {
      document.documentElement.style.setProperty("--align", align);
    }
  </script>
</body>
</html>
